name: Build and Deploy
on:
  push:
    branches-ignore:
      - build
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Build
      run: |
        python3 build.py

    - name: Deploy
      if: github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@4.0.0
      with:
        branch: build
        folder: api
